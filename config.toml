# maintain.py configuration
# Copy this file, fill in [repo], and run:
#   python maintain.py run

[repo]
# GitHub owner (user or org) and repository name.
owner = "your-org"
name  = "your-repo"

# Absolute or relative path to the local clone of the repository.
# The supervisor does all git operations here.
path  = "/path/to/local/clone"

# Branch to treat as the trunk.  PRs are opened against it.
default_branch = "main"

# Optional one-line trailer appended to every automated commit message.
# Example: "Automated-by: maintain.py"
# Leave empty (the default) to add no trailer.
commit_trailer = ""

# Optional footer appended to every PR body.
# Example: "---\nGenerated by maintain.py"
# Leave empty (the default) to add no footer.
pr_footer = ""


[codex]
# Codex CLI binary name (must be on PATH).
# Install: npm install -g @openai/codex
cmd   = "codex"
model = "o4-mini"

# Seconds before a single Codex invocation is killed.
timeout = 300

# Flags passed to Codex for READ-ONLY operations (audit, diff-review,
# revalidation).  "exec" is the Codex non-interactive subcommand.
# --model is inserted automatically after the subcommand.
audit_flags = ["exec"]

# Flags passed to Codex for FILE-EDITING operations (repair, implement review
# feedback).  workspace-write sandbox allows Codex to modify files in the repo.
repair_flags = ["exec", "--sandbox", "workspace-write"]

# Per-stage model overrides.  Each key falls back to `model` when absent or
# empty, so existing configs that only set `model` continue to work unchanged.
#
# audit_model      = "o4-mini"  # scoped code audit (finding discovery)
# revalidate_model = "o4-mini"  # stale-check before repair
# validate_model   = "o4-mini"  # confirm a finding before attempting repair
# repair_model     = "o4-mini"  # apply the code fix
# verify_model     = "o4-mini"  # diff-review after repair
# review_model     = "o4-mini"  # PR review + implement blocking feedback


[verify]
# Optional shell command run inside the repo before opening a PR.
# If it exits non-zero the fix is discarded and the finding is re-queued.
# Leave empty to skip local verification.
#
# Examples:
#   test_cmd = "npm test"
#   test_cmd = "pytest -x -q"
#   test_cmd = "cargo test --quiet"
#   test_cmd = "make test lint"
test_cmd = ""

# Seconds to wait for GitHub CI checks to complete before merging.
# 0 = do not wait (equivalent to allow_no_ci = true — only use on repos
# without CI, because the supervisor will then attempt to merge without
# checking any CI results).
ci_wait_timeout = 600

# Set to true ONLY for repositories that genuinely have no CI.
# When false (the default), 'no CI checks found', API errors, and timeouts
# all block the merge.  Only an explicit GitHub "success" result permits
# a merge.
allow_no_ci = false


[budget]
# How many consecutive clean audits (finding 0 new issues) before an area is
# declared exhausted.  Exhaustion is tied to the audited HEAD commit — a new
# merge resets the streak and triggers a re-audit.
max_audits_per_area = 3

# Maximum findings fixed in a single supervisor run (prevents runaway billing).
max_fixes_per_run = 20

# Maximum Codex review→fix cycles per PR.  Exhausting this budget closes the
# PR and marks the finding as "blocked" (not silently approved).
max_review_rounds = 4

# Abort the current run if this many operations fail back-to-back.
max_consecutive_failures = 5

# Total Codex CLI invocations allowed per run.
codex_call_budget = 100

# Maximum no-change repair attempts before a finding is escalated to "blocked"
# and removed from the automatic queue for human review.  The counter persists
# across HEAD changes so that a finding which regresses repeatedly cannot loop
# forever; it resets only when the finding is genuinely fixed or goes stale.
max_repair_attempts = 3


# ── Audit areas ────────────────────────────────────────────────────────────────
# Each [[audit_areas]] block defines one scoped audit that Codex will run.
# The "description" is injected verbatim into the audit prompt, so be specific.
# You can add, remove, or reorder areas; exhaustion is tracked independently
# per area and per HEAD commit.
#
# The nine areas below are the defaults built into maintain.py.
# Uncomment and customise as needed (overrides the built-in defaults entirely
# when any [[audit_areas]] entry is present in this file).

# [[audit_areas]]
# name        = "correctness"
# description = "logic errors, off-by-one bugs, incorrect assumptions, unhandled edge cases, wrong error handling"

# [[audit_areas]]
# name        = "security"
# description = "injection vulnerabilities, trust boundary violations, exposed secrets, auth bypass, unsafe deserialization, path traversal"

# [[audit_areas]]
# name        = "reliability"
# description = "race conditions, resource leaks, missing error recovery, fragile assumptions about external services, missing retries"

# [[audit_areas]]
# name        = "tests"
# description = "missing coverage for critical paths, incorrect assertions, fragile or flaky tests, untested error paths"

# [[audit_areas]]
# name        = "persistence"
# description = "data integrity issues, unsafe migrations, missing crash recovery, silent data loss, index or transaction gaps"

# [[audit_areas]]
# name        = "api_contracts"
# description = "inconsistent interfaces, missing input validation, undocumented breaking changes, incorrect API documentation"

# [[audit_areas]]
# name        = "dependencies"
# description = "unused imports and packages, dead code, outdated dependencies with known vulnerabilities, shadowed or circular imports"

# [[audit_areas]]
# name        = "maintainability"
# description = "confusing naming, duplicated logic, excessive complexity that makes future changes error-prone"

# [[audit_areas]]
# name        = "documentation"
# description = "missing or inaccurate docstrings, incorrect README claims, undocumented public APIs, stale usage examples, misleading inline comments"
